<script>

  // Array para armazenar empresas cadastradas para validação de código de ativação 
  let usernameCadastrado = [];
  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    usernameCadastrado.push(nome_input.value);
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;
    var titaVar = ipt_tita.value;

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == "" ||
      titaVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Mensagem de erro para todos os campos em branco)";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    let caracteres = [
    "!", "@", "#", "$", "%", "&", "*", "-", "_",
    "+", "/", "|", ".", ",", ";", ":", "~", "^",
    "[", "]", "{", "}", "(", ")"];
    let temCaractereEspecial = false
    for(let i = 0; i < caracteres.length; i++){
      if(senhaVar.includes(caracteres[i])){
        temCaractereEspecial = true;
        break;
      }
    }
    if(temCaractereEspecial) {
  console.log("A senha tem caractere especial")
  } else {
      cardErro.style.display = 'block';
      mensagem_erro.innerHTML =
      'A senha precisa ter pelo menos um caractere especial!'
      finalizarAguardar();
      return false;
      setInterval(sumirMensagem, 5000);
    }

    if (!emailVar.includes('@') || !emailVar.includes('.com')) {
      cardErro.style.display = 'block';
      mensagem_erro.innerHTML =
      'Email deve incluir @ e .com'
      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }
    
    if (senhaVar.length < 8) {
      cardErro.style.display = 'block';
      msg_error.innerHTML =
      'Sua senha precisa ter no minimo 8 caracteres'
    } else {
      setInterval(sumirMensagem, 5000);
    }
    
    if (nomeVar.length < 4  ) {
      cardErro.style.display = 'block';
      mensagem_erro.innerHTML =
        'Seu username precisa ter pelo menos 4 caracteres'
      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }



    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
        titaServer: titaVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }
