        <div id="pontuacao" class="flex-colunar width-fit-content border-primary">

        </div>

        <div id="jogo" class="width-fit-content flex-colunar border-secondary">

            <div id="infoQuestao" class="padding-8">

                    questões.</span>

            <div id="perguntaDaQuestaoAtual" class="padding-8">

            <div id="infoAlternativas" class="padding-8">
                <span><em>Escolha uma opção dentre as abaixo:</em></span>
            </div>

            <div id="opcoes" class="flex-colunar padding-8">
                <span>
                    <input type="radio" id="primeiraOpcao" name="option" class="radio" value="alternativaA" />
                    <label for="primeiraOpcao" class="option" id="labelOpcaoUm"></label>
                </span>
                <span>
                    <input type="radio" id="segundaOpcao" name="option" class="radio" value="alternativaB" />
                    <label for="segundaOpcao" class="option" id="labelOpcaoDois"></label>
                </span>
                <span>
                    <input type="radio" id="terceiraOpcao" name="option" class="radio" value="alternativaC" />
                    <label for="terceiraOpcao" class="option" id="labelOpcaoTres"></label>
                </span>
                <span>
                    <input type="radio" id="quartaOpcao" name="option" class="radio" value="alternativaD" />
                    <label for="quartaOpcao" class="option" id="labelOpcaoQuatro"></label>
                </span>
            </div>

            <div id="botoes" class="flex-colunar padding-8">
    <button onclick="submeter()" id="btnSubmeter" class="btn-quiz">
        Confirmar resposta
    </button>

    <button onclick="avancar()" id="btnProx" class="btn-quiz" disabled>
        Próxima questão
    </button>

    <button onclick="tentarNovamente()" id="btnTentarNovamente" class="btn-quiz btn-reiniciar" disabled>
        Tentar novamente
    </button>
</div>

        </div>
    </div>
    </div>

</body>

<script>
    const listaDeQuestoes = [

    {
        pergunta: "Qual é o nome do protagonista principal de Attack on Titan?",
        alternativaA: "Armin Arlert",
        alternativaB: "Eren Yeager",
        alternativaC: "Levi Ackerman",
        alternativaD: "Jean Kirstein",
        alternativaCorreta: "alternativaB"
    },

    {
        pergunta: "Quantos Titãs Primordiais existem?",
        alternativaA: "7",
        alternativaB: "8",
        alternativaC: "9",
        alternativaD: "10",
        alternativaCorreta: "alternativaC"
    },

    {
        pergunta: "Quantos capítulos possui o mangá de Shingeki no Kyojin?",
        alternativaA: "100",
        alternativaB: "120",
        alternativaC: "139",
        alternativaD: "150",
        alternativaCorreta: "alternativaC"
    },

    {
        pergunta: "Qual personagem é conhecido por sua grande habilidade utilizando os equipamentos de movimentação?",
        alternativaA: "Levi",
        alternativaB: "Connie",
        alternativaC: "Armin",
        alternativaD: "Erwin",
        alternativaCorreta: "alternativaA"
    },

    {
        pergunta: "Qual destes personagens faz parte do trio principal da história?",
        alternativaA: "Reiner",
        alternativaB: "Mikasa",
        alternativaC: "Erwin",
        alternativaD: "Hange",
        alternativaCorreta: "alternativaB"
    },

    {
        pergunta: "Qual é o nome do amigo de infância de Eren e Mikasa?",
        alternativaA: "Armin",
        alternativaB: "Jean",
        alternativaC: "Connie",
        alternativaD: "Floch",
        alternativaCorreta: "alternativaA"
    },

    {
        pergunta: "Qual destas opções representa um dos principais temas presentes em Shingeki no Kyojin?",
        alternativaA: "Liberdade",
        alternativaB: "Corrida de carros",
        alternativaC: "Viagem espacial",
        alternativaD: "Magia medieval",
        alternativaCorreta: "alternativaA"
    },

    {
        pergunta: "Qual personagem é conhecida por sua determinação em proteger as pessoas importantes para ela?",
        alternativaA: "Sasha",
        alternativaB: "Annie",
        alternativaC: "Mikasa",
        alternativaD: "Historia",
        alternativaCorreta: "alternativaC"
    },

    {
        pergunta: "Qual destes é um dos Nove Titãs?",
        alternativaA: "Titã Colossal",
        alternativaB: "Titã Gigante Supremo",
        alternativaC: "Titã Vermelho",
        alternativaD: "Titã Guerreiro",
        alternativaCorreta: "alternativaA"
    },

    {
        pergunta: "Qual personagem possui um grande interesse por estudar e compreender os Titãs?",
        alternativaA: "Hange",
        alternativaB: "Jean",
        alternativaC: "Connie",
        alternativaD: "Mikasa",
        alternativaCorreta: "alternativaA"
    },

    {
        pergunta: "Qual é o sobrenome de Mikasa?",
        alternativaA: "Yeager",
        alternativaB: "Ackerman",
        alternativaC: "Arlert",
        alternativaD: "Braun",
        alternativaCorreta: "alternativaB"
    },

    {
        pergunta: "Qual personagem é conhecido por seu forte senso de liderança?",
        alternativaA: "Erwin Smith",
        alternativaB: "Sasha Blouse",
        alternativaC: "Connie Springer",
        alternativaD: "Marco Bott",
        alternativaCorreta: "alternativaA"
    },

    {
        pergunta: "Em qual mídia Shingeki no Kyojin foi originalmente publicado?",
        alternativaA: "Filme",
        alternativaB: "Mangá",
        alternativaC: "Jogo",
        alternativaD: "Série de livros",
        alternativaCorreta: "alternativaB"
    },

    {
        pergunta: "Qual destes personagens faz parte da Tropa de Exploração em grande parte da história?",
        alternativaA: "Levi",
        alternativaB: "Gabi",
        alternativaC: "Falco",
        alternativaD: "Zeke",
        alternativaCorreta: "alternativaA"
    },

    {
        pergunta: "Qual palavra representa fortemente um dos desejos mais importantes presentes na obra?",
        alternativaA: "Riqueza",
        alternativaB: "Liberdade",
        alternativaC: "Fama",
        alternativaD: "Poder",
        alternativaCorreta: "alternativaB"
    }

]

    // variáveis globais    
    let numeroDaQuestaoAtual = 0
    let pontuacaoFinal = 0
    let tentativaIncorreta = 0
    let certas = 0
    let erradas = 0
    let quantidadeDeQuestoes = listaDeQuestoes.length
    // let isUltima = numeroDaQuestaoAtual == quantidadeDeQuestoes-1 ? true : false

    function onloadEsconder() {
        document.getElementById('pontuacao').style.display = "none"
        document.getElementById('jogo').style.display = "none"
    }

    function iniciarQuiz() {
        document.getElementById('pontuacao').style.display = "flex"
        document.getElementById('jogo').style.display = "flex"
        document.getElementById('btnIniciarQuiz').style.display = "none"
        document.getElementById('spanCertas').innerHTML = 0
        document.getElementById('spanErradas').innerHTML = 0

        document.getElementById('qtdQuestoes').innerHTML = quantidadeDeQuestoes

        preencherHTMLcomQuestaoAtual(0)

        btnSubmeter.style.display = "block"
        btnProx.style.display = "block"
        btnTentarNovamente.style.display = "none"

        btnSubmeter.disabled = false
        btnProx.disabled = true
        btnTentarNovamente.disabled = true
    }

    function preencherHTMLcomQuestaoAtual(index) {
        habilitarAlternativas(true)
        const questaoAtual = listaDeQuestoes[index]
        numeroDaQuestaoAtual = index
        console.log("questaoAtual")
        console.log(questaoAtual)
        document.getElementById("spanNumeroDaQuestaoAtual").innerHTML = Number(index) + 1 // ajustando porque o index começa em 0
        document.getElementById("spanQuestaoExibida").innerHTML = questaoAtual.pergunta;
        document.getElementById("labelOpcaoUm").innerHTML = questaoAtual.alternativaA;
        document.getElementById("labelOpcaoDois").innerHTML = questaoAtual.alternativaB;
        document.getElementById("labelOpcaoTres").innerHTML = questaoAtual.alternativaC;
        document.getElementById("labelOpcaoQuatro").innerHTML = questaoAtual.alternativaD;
    }

    function submeter() {
        const options = document.getElementsByName("option"); // recupera alternativas no html

        let hasChecked = false
        for (let i = 0; i < options.length; i++) {
            if (options[i].checked) {
                hasChecked = true
                break
            }
        }

        if (!hasChecked) {
            alert("Não há alternativas escolhidas. Escolha uma opção.")
        } else {
            btnSubmeter.disabled = true
            btnProx.disabled = false

            habilitarAlternativas(false)

            checarResposta()
        }
    }

    function habilitarAlternativas(trueOrFalse) {
        let opcaoEscolhida = trueOrFalse ? false : true

        primeiraOpcao.disabled = opcaoEscolhida
        segundaOpcao.disabled = opcaoEscolhida
        terceiraOpcao.disabled = opcaoEscolhida
        quartaOpcao.disabled = opcaoEscolhida

    }

    function avancar() {
        btnProx.disabled = true
        btnSubmeter.disabled = false

        desmarcarRadioButtons()

        if (numeroDaQuestaoAtual < quantidadeDeQuestoes - 1) {
            preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual)
        } else if (numeroDaQuestaoAtual == quantidadeDeQuestoes - 1) {
            preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual)
        } else {
            finalizarJogo()
        }
        limparCoresBackgroundOpcoes()
    }  

    function tentarNovamente() {
        // atualiza a página
        window.location.reload()
    }

    function checarResposta() {
        const questaoAtual = listaDeQuestoes[numeroDaQuestaoAtual] // questão atual 
        const respostaQuestaoAtual = questaoAtual.alternativaCorreta // qual é a resposta correta da questão atual

        const options = document.getElementsByName("option"); // recupera alternativas no html

        let alternativaCorreta = null // variável para armazenar a alternativa correta

        options.forEach((option) => {
            if (option.value === respostaQuestaoAtual) {
                console.log("alternativaCorreta está no componente: " + alternativaCorreta)
                alternativaCorreta = option.labels[0].id
            }
        })

        // verifica se resposta assinalada é correta
        options.forEach((option) => {
            if (option.checked === true && option.value === respostaQuestaoAtual) {
                document.getElementById(alternativaCorreta).classList.add("text-success-with-bg")
                pontuacaoFinal++
                certas++
                document.getElementById("spanCertas").innerHTML = certas
                numeroDaQuestaoAtual++
            } else if (option.checked && option.value !== respostaQuestaoAtual) {
                const wrongLabelId = option.labels[0].id

                document.getElementById(wrongLabelId).classList.add("text-danger-with-bg")
                document.getElementById(alternativaCorreta).classList.add("text-success-with-bg")
                tentativaIncorreta++
                erradas++
                document.getElementById("spanErradas").innerHTML = erradas
                numeroDaQuestaoAtual++
            }
        })
    }

    function limparCoresBackgroundOpcoes() {
        const options = document.getElementsByName("option");
        options.forEach((option) => {
            document.getElementById(option.labels[0].id).classList.remove("text-danger-with-bg")
            document.getElementById(option.labels[0].id).classList.remove("text-success-with-bg")
        })
    }

    function desmarcarRadioButtons() {
        const options = document.getElementsByName("option");
        for (let i = 0; i < options.length; i++) {
            options[i].checked = false;
        }
    }

    function finalizarJogo() {

    let textoParaMensagemFinal = ""
    let classComCoresParaMensagemFinal = ""

    const porcentagemFinalDeAcertos =
        pontuacaoFinal / quantidadeDeQuestoes

    if (porcentagemFinalDeAcertos <= 0.3) {

        textoParaMensagemFinal =
            "Ainda há muito para descobrir além das muralhas!"

        classComCoresParaMensagemFinal =
            "text-danger-with-bg"

    } else if (porcentagemFinalDeAcertos < 0.7) {

        textoParaMensagemFinal =
            "Você conhece a obra, mas ainda pode explorar mais!"

        classComCoresParaMensagemFinal =
            "text-warning-with-bg"

    } else if (porcentagemFinalDeAcertos < 1) {

        textoParaMensagemFinal =
            "Muito bem! Você realmente conhece Shingeki no Kyojin!"

        classComCoresParaMensagemFinal =
            "text-success-with-bg"

    } else {

        textoParaMensagemFinal =
            "Perfeito! Você domina completamente o mundo de Shingeki!"

        classComCoresParaMensagemFinal =
            "text-success-with-bg"
    }

    const porcentagem =
        Math.round(porcentagemFinalDeAcertos * 100)

    textoParaMensagemFinal +=
        `<br>Você acertou ${certas} de ${quantidadeDeQuestoes} questões (${porcentagem}%).`

    document.getElementById('msgFinal').innerHTML =
        textoParaMensagemFinal

    document.getElementById('msgFinal').className =
        "width-fit-content " + classComCoresParaMensagemFinal

    document.getElementById('spanPontuacaoFinal').innerHTML = pontuacaoFinal

    document.getElementById('infoQuestao').style.display = "none"

    document.getElementById('perguntaDaQuestaoAtual').style.display = "none"

    document.getElementById('infoAlternativas').style.display = "none"

    document.getElementById('opcoes').style.display = "none"


    btnSubmeter.style.display = "none"

    btnProx.style.display = "none"

    btnTentarNovamente.style.display = "block"

    btnTentarNovamente.disabled = false

    var pontoFinalVar = pontuacaoFinal;
    var respostascertasVar = certas;
    var respostaserradasVar = erradas;
    var userIDVar = sessionStorage.ID_USUARIO;


    console.log("Payload quiz:", {
        pontoFinalServer: pontoFinalVar,
        respostascertasServer: respostascertasVar,
        respostaserradasServer: respostaserradasVar,
        userIDServer: userIDVar
    });
    if (!userIDVar) console.warn("userIDVar indefinido. Verifique sessionStorage.ID_USUARIO");

fetch("/quiz/cadastrar", {
    method: "POST",
    headers: {
        "Content-Type": "application/json",
    },
        body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        pontoFinalServer: pontoFinalVar,
        respostascertasServer: respostascertasVar,
        respostaserradasServer: respostaserradasVar,
        userIDServer: userIDVar
    }),
})

}

function cadastrar(){

}    
</script>
