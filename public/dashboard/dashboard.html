<script>
    b_usuario.innerHTML = sessionStorage.USERNAME_USUARIO;

    function respostasCertasGrafico() {

        fetch(`/avaliacao/grafico/respostasCertas`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    resposta.reverse();
                    plotarGraficorespostasCertas(resposta);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    }

    function mediaAvaliacoes() {
        fetch(`/avaliacao/grafico/mediaAvaliacoes`, { cache: 'no-store' })
    .then(function (response) {
        if (response.ok) {
            response.json().then(function (resposta) {
                console.log('Dados recebidos (mediaAvaliacoes):', resposta);
                // Se 'resposta' for um Array (ex: [{ media: 8.5 }]), pegue o primeiro item:
                const dados = Array.isArray(resposta) ? resposta[0] : resposta;
                // Usa ?. para evitar erro caso venha vazio do banco
                const valorMedia = dados.media ?? dados['Suas tentativas no quiz'] ?? 'Sem avaliações';
                document.getElementById("mediaAvaliacoes").textContent = valorMedia;
            });
        }
    })
    .catch(function (erro) {
        console.error('Erro na requisição:', erro);
    });
    }

    function temaFavorito() {
        fetch(`/avaliacao/grafico/temaFavorito`, { cache: 'no-store' })
    .then(function (response) {
        if (response.ok) {
            response.json().then(function (resposta) {
                console.log('Dados recebidos (temaFavorito):', resposta);
                const dados = Array.isArray(resposta) ? resposta[0] : resposta;
                // Usa ?. para evitar erro caso venha vazio do banco
                const tema = dados.media ?? dados['aspecto'] ?? 'Sem tema favorito';
                document.getElementById("temaFavorito").textContent = tema;
            });
        }
    })
    .catch(function (erro) {
        console.error('Erro na requisição:', erro);
    });
    }

    function tentativasUser() {
        // obter id do usuário da sessionStorage
        const userId = sessionStorage.ID_USUARIO;
        if (!userId) {
            console.warn('Usuário não autenticado. Não foi possível obter tentativas.');
            document.getElementById("tentativasUser").textContent = 'Sem tentativas';
            return;
        }

        fetch(`/avaliacao/grafico/tentativasUser?userID=${userId}`, { cache: 'no-store' })
    .then(function (response) {
        if (response.ok) {
            response.json().then(function (resposta) {
                console.log('Dados recebidos (tentativasUser):', resposta);
                // Se 'resposta' for um Array (ex: [{ tentativasUsuario: 8 }]), pegue o primeiro item:
                const dados = Array.isArray(resposta) ? resposta[0] : resposta;
                // Usa ?? para evitar erro caso venha vazio do banco; aceita tanto tentativasUsuario quanto tentativas
                const tentativasUsuario = dados?.tentativasUsuario ?? dados?.tentativas ?? 'Sem tentativas';
                document.getElementById("tentativasUser").textContent = tentativasUsuario;
            });
        } else {
            console.error('Resposta não OK ao buscar tentativas do usuário');
            document.getElementById("tentativasUser").textContent = 'Sem tentativas';
        }
    })
    .catch(function (erro) {
        console.error('Erro na requisição:', erro);
        document.getElementById("tentativasUser").textContent = 'Sem tentativas';
    });
    }

            function plotarGraficoTiposTitas(resposta) {
                console.log('plotando gráfico de tipos de titãs...');

                let labels = [];
                let dados = {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Quantidade',
                            data: [],
                            backgroundColor: [
                                'rgba(139,37,37,0.8)'
                            ],
                            borderColor: 'rgb(199, 52, 52)'
                        }]
                };

                for (let i = 0; i < resposta.length; i++) {
                    var registro = resposta[i];
                    // dependendo do nome da coluna retornada pelo banco, ajustar abaixo
                    labels.push(registro.tipo_tita || registro.tipoTita || registro.Tipo_Tita || registro.Tipo);
                    dados.datasets[0].data.push(registro.quantidade || registro.Quantidade || registro.qtd);
                }

                const config = {
                    type: 'bar',
                    data: dados,
                    options: {
                        plugins: {
                            title: {
                                display: true,
                                text: 'Tipos de titãs mais escolhidos',
                                align: 'center',
                                color: '#17191D',
                            },
                        },
                        indexAxis: 'x'
                    }
                };

                // cria o gráfico na canvas tiposTitas
                let myChart = new Chart(
                    document.getElementById(`tiposTitas`),
                    config
                );
            }
